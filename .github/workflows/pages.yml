name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (web app at the root, URDF meshes, manual page images used as figures, licence files)
        run: |
          set -euo pipefail
          HW=cad/rpo_hardware
          URDF=$HW/V2.0/roboto_origin_mechanic/03_URDF
          mkdir -p "_site/$URDF" "_site/$HW" _site/manual
          # web/cad and web/manual are symlinks for local development; ship real files instead
          rsync -a --exclude cad --exclude manual web/ _site/
          cp -R "$URDF/urdf" "$URDF/meshes" "_site/$URDF/"
          cp "$HW"/LICENSE "$HW"/LICENSES.md "$HW"/TRADEMARKS.md "$HW"/THIRD_PARTY_NOTICES.md "_site/$HW/"
          cp cad/SOURCE.txt _site/cad/
          cp -R manual/img _site/manual/img
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
